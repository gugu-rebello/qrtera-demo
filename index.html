<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>tera · ler nota fiscal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  .logo {
    font-size: 32px;
    font-weight: 800;
    color: #FF6600;
    letter-spacing: -1px;
    line-height: 1;
  }
  .secure {
    font-size: 12px;
    color: #888;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .secure-icon {
    width: 12px;
    height: 12px;
    display: inline-block;
    border: 1.5px solid #888;
    border-radius: 2px;
    position: relative;
  }
  .secure-icon::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 2px;
    width: 6px;
    height: 6px;
    border: 1.5px solid #888;
    border-bottom: none;
    border-radius: 3px 3px 0 0;
  }
  .campaign-label {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 4px;
  }
  .campaign-name {
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 24px;
  }
  .scanner-wrapper {
    position: relative;
    background: #1a1a1a;
    border-radius: 16px;
    aspect-ratio: 1;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px dashed #FF6600;
  }
  #reader {
    width: 100%;
    height: 100%;
  }
  #reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    border-radius: 14px;
  }
  .scanner-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: #888;
    z-index: 1;
  }
  .scanner-placeholder.hidden { display: none; }
  .qr-icon {
    width: 64px;
    height: 64px;
    border: 3px solid #555;
    border-radius: 8px;
    position: relative;
    margin-bottom: 16px;
  }
  .qr-icon::before, .qr-icon::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    border: 3px solid #555;
  }
  .qr-icon::before {
    top: 6px;
    left: 6px;
    border-right: none;
    border-bottom: none;
  }
  .qr-icon::after {
    bottom: 6px;
    right: 6px;
    border-left: none;
    border-top: none;
  }
  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid #333;
    border-top-color: #FF6600;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .scanner-text {
    font-size: 14px;
    line-height: 1.5;
  }
  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: #FF6600;
    border-style: solid;
    z-index: 2;
    pointer-events: none;
  }
  .corner.tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }
  .hint {
    font-size: 12px;
    color: #777;
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: #333;
  }
  .divider-text {
    font-size: 11px;
    color: #555;
    text-transform: lowercase;
  }
  .btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid #444;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active {
    background: #1a1a1a;
    border-color: #FF6600;
  }
  .btn-primary {
    background: #FF6600;
    border-color: #FF6600;
  }
  .btn-primary:active {
    background: #cc5200;
    border-color: #cc5200;
  }
  .btn-hidden { display: none; }
  .keyboard-icon {
    width: 20px;
    height: 14px;
    border: 1.5px solid currentColor;
    border-radius: 3px;
    position: relative;
  }
  .keyboard-icon::before {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 3px;
    right: 3px;
    height: 1.5px;
    background: currentColor;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: #1a1a1a;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    width: 100%;
    max-width: 420px;
    border: 0.5px solid #333;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .modal-subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .key-input {
    width: 100%;
    padding: 14px;
    background: #0a0a0a;
    border: 0.5px solid #444;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .key-input:focus {
    outline: none;
    border-color: #FF6600;
  }
  .key-counter {
    font-size: 11px;
    color: #666;
    text-align: right;
    margin-bottom: 16px;
  }
  .key-counter.valid { color: #4ade80; }
  .result {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 24px;
  }
  .result.open { display: flex; }
  .result-card {
    text-align: center;
    max-width: 320px;
    width: 100%;
  }
  .result-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 500;
  }
  .result-icon.success {
    background: rgba(74, 222, 128, 0.15);
    color: #4ade80;
  }
  .result-icon.error {
    background: rgba(248, 113, 113, 0.15);
    color: #f87171;
  }
  .result-title {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 12px;
  }
  .result-msg {
    font-size: 14px;
    color: #aaa;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .key-shown {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: #FF6600;
    background: rgba(255, 102, 0, 0.1);
    padding: 8px 12px;
    border-radius: 6px;
    word-break: break-all;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .countdown {
    font-size: 13px;
    color: #888;
    margin-bottom: 16px;
  }
  .countdown-number {
    color: #FF6600;
    font-weight: 500;
  }
  .btn-whatsapp {
    background: #25D366;
    border-color: #25D366;
    color: #0a0a0a;
    font-weight: 500;
  }
  .btn-whatsapp:active {
    background: #1da851;
    border-color: #1da851;
  }
  .whatsapp-icon {
    width: 20px;
    height: 20px;
    display: inline-block;
    flex-shrink: 0;
  }
  .footer-brand {
    margin-top: auto;
    padding-top: 32px;
    text-align: center;
  }
  .footer-tag {
    font-size: 11px;
    color: #444;
    margin-top: 8px;
  }
  .scanning .scanner-placeholder { display: none; }
  #reader__dashboard_section_csr button,
  #reader__dashboard_section_swaplink,
  #reader__header_message,
  #reader__dashboard_section_fsr {
    display: none !important;
  }
  #reader__scan_region {
    background: transparent !important;
  }
  #reader__scan_region img {
    display: none !important;
  }
  .error-banner {
    background: rgba(248, 113, 113, 0.1);
    border: 0.5px solid rgba(248, 113, 113, 0.3);
    color: #f87171;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    margin-bottom: 12px;
    display: none;
  }
  .error-banner.show { display: block; }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">tera</div>
    <div class="secure">
      <span class="secure-icon"></span>
      seguro
    </div>
  </div>

  <div class="campaign-label">campanha</div>
  <div class="campaign-name">promoção demo Tera</div>

  <div class="scanner-wrapper" id="scannerWrapper">
    <div id="reader"></div>
    <div class="scanner-placeholder" id="placeholder">
      <div class="loading-spinner" id="spinner"></div>
      <div class="scanner-text" id="placeholderText">iniciando câmera...</div>
    </div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>

  <div class="hint">detectando 44 dígitos automaticamente</div>

  <div class="error-banner" id="errorBanner"></div>

  <button class="btn btn-primary btn-hidden" id="startBtn">iniciar câmera</button>

  <div class="divider"><span class="divider-text">ou</span></div>

  <button class="btn" id="manualBtn">
    <span class="keyboard-icon"></span>
    digitar os 44 dígitos
  </button>

  <div class="footer-brand">
    <div style="font-size: 18px; font-weight: 800; color: #FF6600; letter-spacing: -0.5px;">tera</div>
    <div class="footer-tag">o cookie offline do Brasil</div>
  </div>

</div>

<div class="modal" id="manualModal">
  <div class="modal-content">
    <div class="modal-title">digitar chave de acesso</div>
    <div class="modal-subtitle">os 44 dígitos que ficam logo abaixo do QR code, na parte de baixo da nota</div>
    <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="44" class="key-input" id="keyInput" placeholder="0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000" autocomplete="off">
    <div class="key-counter" id="keyCounter">0 / 44</div>
    <button class="btn btn-primary" id="submitKeyBtn">enviar</button>
    <div style="height: 8px;"></div>
    <button class="btn" id="cancelKeyBtn">cancelar</button>
  </div>
</div>

<div class="result" id="resultScreen">
  <div class="result-card">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="key-shown" id="keyShown" style="display: none;"></div>
    <div class="countdown" id="countdown" style="display: none;">voltando ao WhatsApp em <span class="countdown-number" id="countdownNumber">3</span>...</div>
    <button class="btn btn-whatsapp" id="whatsappBtn" style="display: none;">
      <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.890-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      voltar ao WhatsApp
    </button>
    <div style="height: 8px;"></div>
    <button class="btn" id="closeResultBtn">ler outra nota</button>
  </div>
</div>

<script>
  var WHATSAPP_NUMBER = '5521979605807';
  var urlParams = new URLSearchParams(window.location.search);
  var customNumber = urlParams.get('wa');
  if (customNumber) WHATSAPP_NUMBER = customNumber.replace(/\D/g, '');

  var scanner = null;
  var isScanning = false;
  var countdownInterval = null;

  var startBtn = document.getElementById('startBtn');
  var manualBtn = document.getElementById('manualBtn');
  var scannerWrapper = document.getElementById('scannerWrapper');
  var placeholder = document.getElementById('placeholder');
  var placeholderText = document.getElementById('placeholderText');
  var spinner = document.getElementById('spinner');
  var errorBanner = document.getElementById('errorBanner');
  var manualModal = document.getElementById('manualModal');
  var keyInput = document.getElementById('keyInput');
  var keyCounter = document.getElementById('keyCounter');
  var submitKeyBtn = document.getElementById('submitKeyBtn');
  var cancelKeyBtn = document.getElementById('cancelKeyBtn');
  var resultScreen = document.getElementById('resultScreen');
  var resultIcon = document.getElementById('resultIcon');
  var resultTitle = document.getElementById('resultTitle');
  var resultMsg = document.getElementById('resultMsg');
  var keyShown = document.getElementById('keyShown');
  var countdown = document.getElementById('countdown');
  var countdownNumber = document.getElementById('countdownNumber');
  var whatsappBtn = document.getElementById('whatsappBtn');
  var closeResultBtn = document.getElementById('closeResultBtn');

  function isValidChaveAcesso(str) {
    var clean = str.replace(/\D/g, '');
    if (clean.length !== 44) return false;
    var uf = clean.substring(0, 2);
    var ufNum = parseInt(uf, 10);
    if (ufNum < 11 || ufNum > 53) return false;
    var modelo = clean.substring(20, 22);
    if (modelo !== '55' && modelo !== '65') return false;
    return validateDV(clean);
  }

  function validateDV(chave) {
    var sum = 0;
    var weight = 2;
    for (var i = 42; i >= 0; i--) {
      sum += parseInt(chave.charAt(i), 10) * weight;
      weight++;
      if (weight > 9) weight = 2;
    }
    var remainder = sum % 11;
    var dv = (remainder < 2) ? 0 : 11 - remainder;
    return dv === parseInt(chave.charAt(43), 10);
  }

  function extractChaveFromQR(decodedText) {
    var match = decodedText.match(/\d{44}/);
    if (match) return match[0];
    var paramMatch = decodedText.match(/[?&]p?=?(\d{44})/i);
    if (paramMatch) return paramMatch[1];
    return null;
  }

  function openWhatsApp() {
    var url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent('nota enviada');
    window.location.href = url;
  }

  function startCountdown() {
    var seconds = 3;
    countdown.style.display = 'block';
    countdownNumber.textContent = seconds;
    countdownInterval = setInterval(function() {
      seconds--;
      if (seconds <= 0) {
        clearInterval(countdownInterval);
        openWhatsApp();
      } else {
        countdownNumber.textContent = seconds;
      }
    }, 1000);
  }

  function showResult(success, chave) {
    if (success) {
      resultIcon.className = 'result-icon success';
      resultIcon.textContent = '✓';
      resultTitle.textContent = 'nota recebida';
      resultMsg.textContent = 'aguarde alguns minutos para a validação da sua participação';
      keyShown.style.display = 'block';
      keyShown.textContent = chave;
      whatsappBtn.style.display = 'flex';
      closeResultBtn.textContent = 'ler outra nota';
      startCountdown();
    } else {
      resultIcon.className = 'result-icon error';
      resultIcon.textContent = '!';
      resultTitle.textContent = 'chave inválida';
      resultMsg.textContent = 'não conseguimos validar esse código. tente ler novamente ou digite os 44 dígitos';
      keyShown.style.display = 'none';
      countdown.style.display = 'none';
      whatsappBtn.style.display = 'none';
      closeResultBtn.textContent = 'tentar novamente';
    }
    resultScreen.classList.add('open');
    if (success && window.navigator.vibrate) {
      window.navigator.vibrate(100);
    }
  }

  function onScanSuccess(decodedText) {
    var chave = extractChaveFromQR(decodedText);
    if (chave && isValidChaveAcesso(chave)) {
      stopScanner();
      showResult(true, chave);
    }
  }

  function onScanError() {}

  function showCameraError(msg) {
    spinner.style.display = 'none';
    placeholderText.innerHTML = '<div class="qr-icon" style="margin: 0 auto 16px;"></div>câmera não iniciou<br><span style="font-size:12px;color:#666">' + msg + '</span>';
    errorBanner.classList.add('show');
    errorBanner.textContent = msg;
    startBtn.classList.remove('btn-hidden');
  }

  function startScanner() {
    if (isScanning) return;

    errorBanner.classList.remove('show');
    spinner.style.display = '';
    placeholderText.textContent = 'iniciando câmera...';
    startBtn.classList.add('btn-hidden');

    if (!scanner) {
      scanner = new Html5Qrcode("reader", { verbose: false });
    }

    var config = {
      fps: 10,
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        var minEdge = Math.min(viewfinderWidth, viewfinderHeight);
        var size = Math.floor(minEdge * 0.7);
        return { width: size, height: size };
      },
      aspectRatio: 1.0,
      disableFlip: false
    };

    scanner.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      onScanError
    ).then(function() {
      isScanning = true;
      scannerWrapper.classList.add('scanning');
      placeholder.classList.add('hidden');
      startBtn.classList.add('btn-hidden');
      errorBanner.classList.remove('show');
    }).catch(function(err) {
      console.error("Erro ao iniciar câmera:", err);
      var msg = 'toque em "iniciar câmera" para autorizar';
      if (err && err.toString) {
        var errStr = err.toString().toLowerCase();
        if (errStr.indexOf('permission') !== -1 || errStr.indexOf('denied') !== -1) {
          msg = 'permissão negada. autorize a câmera nas configurações do navegador';
        } else if (errStr.indexOf('notfound') !== -1) {
          msg = 'câmera não encontrada neste dispositivo';
        } else if (errStr.indexOf('https') !== -1 || errStr.indexOf('secure') !== -1) {
          msg = 'esta página precisa estar em https';
        }
      }
      showCameraError(msg);
    });
  }

  function stopScanner() {
    if (!isScanning || !scanner) return;
    scanner.stop().then(function() {
      isScanning = false;
      scannerWrapper.classList.remove('scanning');
      placeholder.classList.remove('hidden');
    }).catch(function() {
      isScanning = false;
    });
  }

  startBtn.addEventListener('click', startScanner);

  manualBtn.addEventListener('click', function() {
    manualModal.classList.add('open');
    setTimeout(function() { keyInput.focus(); }, 100);
  });

  cancelKeyBtn.addEventListener('click', function() {
    manualModal.classList.remove('open');
    keyInput.value = '';
    updateKeyCounter();
  });

  function updateKeyCounter() {
    var len = keyInput.value.replace(/\D/g, '').length;
    keyCounter.textContent = len + ' / 44';
    if (len === 44) {
      keyCounter.classList.add('valid');
    } else {
      keyCounter.classList.remove('valid');
    }
  }

  keyInput.addEventListener('input', function(e) {
    var clean = e.target.value.replace(/\D/g, '').substring(0, 44);
    e.target.value = clean;
    updateKeyCounter();
  });

  submitKeyBtn.addEventListener('click', function() {
    var chave = keyInput.value.replace(/\D/g, '');
    if (chave.length !== 44) {
      keyInput.style.borderColor = '#f87171';
      setTimeout(function() { keyInput.style.borderColor = ''; }, 1500);
      return;
    }
    var valid = isValidChaveAcesso(chave);
    manualModal.classList.remove('open');
    showResult(valid, chave);
    if (valid) {
      keyInput.value = '';
      updateKeyCounter();
    }
  });

  whatsappBtn.addEventListener('click', function() {
    if (countdownInterval) clearInterval(countdownInterval);
    openWhatsApp();
  });

  closeResultBtn.addEventListener('click', function() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdown.style.display = 'none';
    resultScreen.classList.remove('open');
    if (!isScanning) {
      startScanner();
    }
  });

  window.addEventListener('load', function() {
    setTimeout(startScanner, 300);
  });
</script>
